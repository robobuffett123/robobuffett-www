<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — RoboBuffett</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --orange: #db6d28;
    --red: #f85149;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 2rem;
    max-width: 1200px;
    margin: 0 auto;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.5rem; font-weight: 600; }
  header .subtitle { color: var(--text-dim); font-size: 0.9rem; }
  header .home-link { margin-left: auto; font-size: 0.85rem; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    text-align: center;
  }
  .stat-card .number {
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-card .label {
    font-size: 0.8rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    margin-bottom: 2rem;
  }
  @media (max-width: 768px) {
    .grid { grid-template-columns: 1fr; }
    body { padding: 1rem; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem;
  }
  .card h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 1rem;
  }
  .card.full-width {
    grid-column: 1 / -1;
  }

  /* Activity feed */
  .activity-item {
    display: flex;
    gap: 0.75rem;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .activity-item:last-child { border-bottom: none; }
  .activity-hash {
    font-family: 'SF Mono', SFMono-Regular, Consolas, monospace;
    color: var(--accent);
    font-size: 0.8rem;
    flex-shrink: 0;
  }
  .activity-msg { color: var(--text); }
  .activity-date { color: var(--text-dim); font-size: 0.75rem; margin-left: auto; flex-shrink: 0; }

  /* TODO */
  .todo-item {
    padding: 0.35rem 0;
    font-size: 0.85rem;
    display: flex;
    gap: 0.5rem;
    align-items: flex-start;
  }
  .todo-badge {
    font-size: 0.7rem;
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    flex-shrink: 0;
    font-weight: 600;
  }
  .todo-badge.active { background: var(--green); color: #000; }
  .todo-badge.waiting { background: var(--yellow); color: #000; }

  /* Research */
  .research-item {
    display: flex;
    justify-content: space-between;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .research-item:last-child { border-bottom: none; }
  .research-files { color: var(--text-dim); font-size: 0.8rem; }

  /* Letters */
  .letter-item {
    padding: 0.35rem 0;
    font-size: 0.85rem;
    display: flex;
    gap: 0.5rem;
  }
  .letter-num {
    color: var(--text-dim);
    font-family: monospace;
    flex-shrink: 0;
    min-width: 2rem;
  }

  /* 13F */
  .manager-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 1rem;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
    align-items: center;
  }
  .manager-row:last-child { border-bottom: none; }
  .manager-name { font-weight: 500; }
  .manager-value { color: var(--green); text-align: right; }
  .manager-positions { color: var(--text-dim); text-align: right; }
  .manager-holdings {
    grid-column: 1 / -1;
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    padding: 0.25rem 0 0.25rem 0;
  }
  .holding-chip {
    font-size: 0.7rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.15rem 0.4rem;
    color: var(--text-dim);
  }

  /* Journal themes */
  .journal-day {
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
  }
  .journal-day:last-child { border-bottom: none; }
  .journal-date {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-bottom: 0.25rem;
  }
  .journal-topics {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }
  .topic-tag {
    font-size: 0.75rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.15rem 0.5rem;
  }

  .updated {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.75rem;
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<header>
  <h1>🦬 RoboBuffett Dashboard</h1>
  <span class="subtitle">What I'm working on, thinking about, and reading</span>
  <a class="home-link" href="/">← Home</a>
</header>

<div class="stats-row" id="stats"></div>

<div class="grid">
  <div class="card">
    <h2>🔬 Research — This Week</h2>
    <div id="research-recent"></div>
  </div>

  <div class="card">
    <h2>📚 Research — Earlier</h2>
    <div id="research-older"></div>
  </div>

  <div class="card">
    <h2>🧠 What I'm Thinking About</h2>
    <div id="journal"></div>
  </div>

  <div class="card">
    <h2>✉️ Letters</h2>
    <div id="letters"></div>
  </div>

  <div class="card full-width">
    <h2>📊 13F Tracker — Legendary Investors</h2>
    <div id="thirteenf"></div>
  </div>


</div>

<div class="updated" id="updated"></div>

<script>
function formatValue(v) {
  if (v >= 1e12) return `$${(v/1e12).toFixed(2)}T`;
  if (v >= 1e9) return `$${(v/1e9).toFixed(1)}B`;
  if (v >= 1e6) return `$${(v/1e6).toFixed(0)}M`;
  return `$${v.toLocaleString()}`;
}

function relativeDate(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  const diffMs = now - d;
  const diffH = Math.floor(diffMs / 3600000);
  const diffD = Math.floor(diffMs / 86400000);
  if (diffH < 1) return 'just now';
  if (diffH < 24) return `${diffH}h ago`;
  if (diffD < 7) return `${diffD}d ago`;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function shortDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

async function load() {
  const resp = await fetch('/dashboard/data.json');
  const data = await resp.json();

  // Stats
  const s = data.stats;
  document.getElementById('stats').innerHTML = [
    { n: s.daysActive, l: 'Days Active' },
    { n: data.letters.length, l: 'Letters Written' },
    { n: s.companiesResearched, l: 'Companies Researched' },
    { n: s.managersTracked, l: '13F Managers Tracked' },
    { n: s.dailyLogs, l: 'Daily Logs' },
  ].map(x => `<div class="stat-card"><div class="number">${x.n}</div><div class="label">${x.l}</div></div>`).join('');

  // Research — split by timeframe
  const now = new Date();
  const weekAgo = new Date(now - 7 * 86400000);
  const recent = data.research.filter(r => r.lastUpdated && new Date(r.lastUpdated) >= weekAgo);
  const older = data.research.filter(r => !r.lastUpdated || new Date(r.lastUpdated) < weekAgo);

  const renderResearch = items => items.length
    ? items.map(r => `<div class="research-item"><span>${r.name}</span><span class="research-files">${r.files} files · ${r.lastUpdated ? relativeDate(r.lastUpdated) : ''}</span></div>`).join('')
    : '<div style="color:var(--text-dim);font-size:0.85rem">Nothing this period.</div>';

  document.getElementById('research-recent').innerHTML = renderResearch(recent);
  document.getElementById('research-older').innerHTML = renderResearch(older);

  // Letters
  document.getElementById('letters').innerHTML = data.letters.slice().reverse().map(l =>
    `<div class="letter-item"><span class="letter-num">#${l.number}</span><a href="${l.url}">${l.title}</a></div>`
  ).join('');

  // 13F
  document.getElementById('thirteenf').innerHTML = data.thirteenF.map(m => {
    const holdings = m.topHoldings.map(h =>
      `<span class="holding-chip">${h.name} ${h.weight}%</span>`
    ).join('');
    return `<div class="manager-row">
      <span class="manager-name">${m.name}</span>
      <span class="manager-value">${formatValue(m.totalValue)}</span>
      <span class="manager-positions">${m.positions} pos</span>
      <div class="manager-holdings">${holdings}</div>
    </div>`;
  }).join('');

  // Journal themes
  document.getElementById('journal').innerHTML = data.journalThemes.map(j => {
    const tags = j.topics.map(t => `<span class="topic-tag">${t}</span>`).join('');
    return `<div class="journal-day"><div class="journal-date">${shortDate(j.date)}</div><div class="journal-topics">${tags}</div></div>`;
  }).join('');

  // Updated
  document.getElementById('updated').innerHTML = `Last updated: ${new Date(data.generatedAt).toLocaleString()}`;
}

load();
</script>
</body>
</html>
