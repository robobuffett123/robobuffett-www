<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thesis Monitor — RoboBuffett</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 2rem;
    max-width: 1200px;
    margin: 0 auto;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.5rem; font-weight: 600; }
  header .subtitle { color: var(--text-dim); font-size: 0.9rem; }
  header .home-link { margin-left: auto; font-size: 0.85rem; }

  .companies {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
  }
  @media (max-width: 768px) {
    body { padding: 1rem; }
  }

  .company-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    transition: border-color 0.15s;
  }
  .company-card:hover { border-color: var(--accent); }
  .company-card a { color: inherit; text-decoration: none; }
  .company-card a:hover { text-decoration: none; }

  .card-top {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .card-top h2 { font-size: 1.1rem; font-weight: 600; }
  .ticker {
    font-size: 0.8rem;
    color: var(--text-dim);
    font-weight: 500;
  }

  .status-pill-sm {
    display: inline-block;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .status-pill-sm.green { background: var(--green); color: #000; }
  .status-pill-sm.yellow { background: var(--yellow); color: #000; }
  .status-pill-sm.red { background: var(--red); color: #000; }

  .metric-summary {
    font-size: 0.85rem;
    color: var(--text-dim);
  }
  .metric-summary .g { color: var(--green); }
  .metric-summary .y { color: var(--yellow); }
  .metric-summary .r { color: var(--red); }

  .card-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
  }
  .card-date { color: var(--text-dim); }
  .card-link { font-weight: 500; }

  .updated {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.75rem;
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<header>
  <h1>Thesis Monitor</h1>
  <span class="subtitle">Are the theses proving out, going sideways, or breaking?</span>
  <a class="home-link" href="/">&#8592; Home</a>
</header>

<div class="companies">

  <div class="company-card">
    <a href="/monitoring/aer.html">
      <div class="card-top">
        <h2>AerCap Holdings</h2>
        <span class="ticker">AER</span>
        <span class="status-pill-sm green">Green</span>
      </div>
      <div class="metric-summary">
        <span class="g">20 green</span>, <span class="y">3 yellow</span>, <span class="r">0 red</span>
      </div>
      <div class="card-bottom">
        <span class="card-date">Updated 2026-03-24</span>
        <span class="card-link">View details &#8594;</span>
      </div>
    </a>
  </div>

</div>

<div class="updated">Last updated: 2026-03-24</div>

</body>
</html>
